
<!DOCTYPE html>
<html lang="en">
<head>

  <title>Booking Confirmation | Eventora</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

      <a class="btn btn-primary full-width" href="index.html">
        Discover More Events ↗
      </a>
    </section>
  </main>
